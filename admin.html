<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00A8A8">
    <meta name="robots" content="noindex, nofollow">
    <title>房間管理 · 旅遊行程</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        :root{
            --primary:#00A8A8; --secondary:#20C997; --dark:#1F4D4D;
            --light:#E8F7F7; --border:#B8E6E6; --danger:#FF6B6B; --gray:#999;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'Segoe UI',Tahoma,sans-serif;
            background:linear-gradient(135deg,#E8F7F7 0%,#B8E6E6 100%);
            color:var(--dark); line-height:1.6; min-height:100vh; padding:0 0 40px;
        }
        .wrap{max-width:760px;margin:0 auto;padding:0 14px;}

        header{
            background:linear-gradient(135deg,#00A8A8 0%,#20C997 100%);
            color:#fff; padding:22px 14px; text-align:center; margin-bottom:18px;
        }
        header h1{font-size:22px;}
        header p{font-size:12px;opacity:.9;margin-top:2px;}

        /* 密碼閘門 */
        .gate{
            max-width:340px;margin:60px auto;background:#fff;border-radius:18px;
            padding:28px 22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.1);
        }
        .gate h2{font-size:18px;margin-bottom:6px;}
        .gate p{font-size:12px;color:var(--gray);margin-bottom:18px;}
        .gate input{
            width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;
            font-size:16px;text-align:center;margin-bottom:12px;
        }
        .gate input:focus{outline:none;border-color:var(--primary);}
        .btn{
            border:none;border-radius:12px;font-weight:700;cursor:pointer;
            transition:all .2s;font-size:13px;padding:11px 16px;
        }
        .btn-primary{background:var(--primary);color:#fff;width:100%;}
        .btn-primary:hover{background:#008C8C;}

        /* 工具列 */
        .toolbar{
            display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;
        }
        .toolbar .count{font-size:13px;font-weight:700;color:var(--dark);margin-right:auto;}
        .btn-sm{padding:8px 12px;font-size:12px;border-radius:10px;}
        .btn-light{background:#fff;color:var(--dark);border:1.5px solid var(--border);}
        .btn-light:hover{background:var(--light);}

        /* 房間卡片 */
        .room{
            background:#fff;border:1.5px solid #eef0f0;border-radius:14px;
            padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.05);
        }
        .room-top{display:flex;align-items:center;gap:10px;}
        .room-emoji{font-size:26px;flex-shrink:0;}
        .room-main{flex:1;min-width:0;}
        .room-title{font-size:15px;font-weight:700;color:var(--dark);}
        .room-code{
            font-size:12px;font-weight:800;letter-spacing:2px;color:var(--primary);
            font-variant-numeric:tabular-nums;
        }
        .room-meta{font-size:11.5px;color:var(--gray);margin-top:2px;}
        .room-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
        .stat{
            font-size:11px;color:var(--dark);background:var(--light);
            border-radius:8px;padding:3px 9px;
        }
        .room-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
        .btn-open{background:var(--primary);color:#fff;}
        .btn-open:hover{background:#008C8C;}
        .btn-view{background:#fff;color:var(--primary);border:1.5px solid var(--border);}
        .btn-exp{background:#fff;color:var(--dark);border:1.5px solid var(--border);}
        .btn-del{background:#fff;color:var(--danger);border:1.5px solid #FFD3D3;}
        .btn-del:hover{background:var(--danger);color:#fff;}

        .empty,.loading{
            text-align:center;color:var(--gray);font-size:13px;padding:40px 0;
        }
        .toast{
            position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
            background:var(--primary);color:#fff;padding:10px 20px;border-radius:10px;
            font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2);
            opacity:0;transition:opacity .25s;z-index:999;pointer-events:none;
        }
        .toast.show{opacity:1;}
    </style>
</head>
<body>
    <!-- 密碼閘門 -->
    <div id="gate" class="gate">
        <h2>🔐 房間管理</h2>
        <p>請輸入管理密碼</p>
        <input type="password" id="pw" placeholder="管理密碼" onkeydown="if(event.key==='Enter')tryLogin()">
        <button class="btn btn-primary" onclick="tryLogin()">進入</button>
    </div>

    <!-- 主畫面 -->
    <div id="app" style="display:none;">
        <header>
            <h1>🗂️ 房間管理</h1>
            <p>檢視 / 開啟 / 刪除 / 備份所有行程房間</p>
        </header>
        <div class="wrap">
            <div class="toolbar">
                <span class="count" id="count">載入中…</span>
                <button class="btn btn-sm btn-light" onclick="loadRooms()">🔄 重新整理</button>
                <button class="btn btn-sm btn-light" onclick="exportAll()">📦 匯出全部</button>
            </div>
            <div id="list"><div class="loading">載入中…</div></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
    // ══════════════════════════════════════════
    // 設定（與 index.html 相同的 Firebase 專案）
    // ══════════════════════════════════════════
    const firebaseConfig = {
        apiKey:            "AIzaSyAjjy9ZK38JD-C-2kYu89o-7UCQ4u8nF3E",
        authDomain:        "okinawa-travel-966a1.firebaseapp.com",
        projectId:         "okinawa-travel-966a1",
        storageBucket:     "okinawa-travel-966a1.firebasestorage.app",
        messagingSenderId: "155129370619",
        appId:             "1:155129370619:web:e12e87807651dd9ddf5d5e",
        databaseURL:       "https://okinawa-travel-966a1-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    // ⚠️ 簡易密碼（純前端，僅擋一般人；懂技術者看原始碼可見，請勿放真正機密）
    const ADMIN_PASSWORD = "okinawa2026";   // ← 想換密碼改這裡

    // 主 App 網址（用於「開啟」按鈕）。同網域時用相對路徑即可。
    const APP_URL = "index.html";

    let db = null;
    let roomsCache = {}; // { code: dataObj }

    function toast(msg){
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        clearTimeout(toast._t);
        toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
    }

    function tryLogin(){
        const v = document.getElementById('pw').value;
        if (v !== ADMIN_PASSWORD){ toast('密碼錯誤'); return; }
        sessionStorage.setItem('adminOK','1');
        showApp();
    }

    function showApp(){
        document.getElementById('gate').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        initFirebase();
        loadRooms();
    }

    function initFirebase(){
        if (db) return;
        try{
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        }catch(e){
            console.error(e);
            document.getElementById('list').innerHTML =
                '<div class="empty">Firebase 初始化失敗，請重新整理。</div>';
        }
    }

    // ── 讀取所有房間 ──
    function loadRooms(){
        if (!db) return;
        document.getElementById('list').innerHTML = '<div class="loading">讀取房間中…</div>';
        db.ref('rooms').once('value')
            .then(snap=>{
                const rooms = snap.val() || {};
                roomsCache = {};
                Object.keys(rooms).forEach(code=>{
                    roomsCache[code] = (rooms[code] && rooms[code].data) || {};
                });
                renderRooms();
            })
            .catch(err=>{
                console.error(err);
                document.getElementById('list').innerHTML =
                    '<div class="empty">讀取失敗：' + (err.code||err.message||'') +
                    '<br><br>若顯示權限不足，請確認 Firebase 規則允許讀取 rooms。</div>';
            });
    }

    function esc(s){
        return String(s==null?'':s).replace(/[&<>"]/g, c=>(
            {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    function fmtDateRange(t){
        const a=(t&&t.startDate)||'', b=(t&&t.endDate)||'';
        if(a&&b) return a+' ～ '+b;
        return a||b||'未設定日期';
    }

    function renderRooms(){
        const codes = Object.keys(roomsCache).sort();
        document.getElementById('count').textContent = '共 ' + codes.length + ' 個房間';
        if (!codes.length){
            document.getElementById('list').innerHTML =
                '<div class="empty">目前沒有任何房間。</div>';
            return;
        }
        const html = codes.map(code=>{
            const d = roomsCache[code] || {};
            const t = d.trip || {};
            const emoji = t.emoji || '🌏';
            const title = t.title || '（未命名行程）';
            const nAct  = (d.activities||[]).length;
            const nExp  = (d.expenses||[]).length;
            const nChk  = (d.checklists||[]).length;
            const nDay  = (d.dayTitles||[]).filter(x=>x).length;
            return `
            <div class="room">
                <div class="room-top">
                    <div class="room-emoji">${esc(emoji)}</div>
                    <div class="room-main">
                        <div class="room-title">${esc(title)}</div>
                        <div class="room-meta">
                            <span class="room-code">${esc(code)}</span>
                            ·  ${esc(fmtDateRange(t))}
                        </div>
                    </div>
                </div>
                <div class="room-stats">
                    <span class="stat">📅 ${nDay} 天</span>
                    <span class="stat">📍 ${nAct} 活動</span>
                    <span class="stat">💰 ${nExp} 費用</span>
                    <span class="stat">✓ ${nChk} 清單</span>
                </div>
                <div class="room-actions">
                    <button class="btn btn-sm btn-open" onclick="openRoom('${code}')">✏️ 開啟編輯</button>
                    <button class="btn btn-sm btn-view" onclick="viewRoom('${code}')">👁️ 預覽</button>
                    <button class="btn btn-sm btn-exp"  onclick="exportRoom('${code}')">📤 匯出</button>
                    <button class="btn btn-sm btn-del"  onclick="deleteRoom('${code}')">🗑️ 刪除</button>
                </div>
            </div>`;
        }).join('');
        document.getElementById('list').innerHTML = html;
    }

    // ── 開啟（編輯模式）：同網域共用 localStorage ──
    function openRoom(code){
        try{ localStorage.setItem('okinawaRoom', code); }catch(e){}
        window.open(APP_URL, '_blank');
    }

    // ── 預覽（唯讀）──
    function viewRoom(code){
        window.open(APP_URL + '?room=' + code + '&view=1', '_blank');
    }

    // ── 匯出單一房間 ──
    function exportRoom(code){
        downloadJSON(roomsCache[code] || {}, 'room-' + code + '.json');
    }

    // ── 匯出全部 ──
    function exportAll(){
        const stamp = new Date().toISOString().slice(0,10);
        downloadJSON(roomsCache, 'all-rooms-' + stamp + '.json');
    }

    function downloadJSON(obj, filename){
        const blob = new Blob([JSON.stringify(obj,null,2)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(url), 1000);
        toast('已下載 ' + filename);
    }

    // ── 刪除房間（二次確認）──
    function deleteRoom(code){
        const d = roomsCache[code] || {};
        const name = (d.trip && d.trip.title) || '（未命名）';
        if (!confirm(`確定要刪除房間 ${code}（${name}）？\n此動作無法復原。`)) return;
        const typed = prompt(`再次確認：請輸入房間碼「${code}」以刪除。`);
        if (typed !== code){ toast('已取消'); return; }
        db.ref('rooms/' + code).remove()
            .then(()=>{
                delete roomsCache[code];
                renderRooms();
                toast('已刪除 ' + code);
            })
            .catch(err=>{
                console.error(err);
                toast('刪除失敗：' + (err.code||err.message||''));
            });
    }

    // 已登入則略過閘門（同分頁內）
    if (sessionStorage.getItem('adminOK')==='1'){
        showApp();
    } else {
        setTimeout(()=>{ const p=document.getElementById('pw'); if(p) p.focus(); }, 200);
    }
    </script>
</body>
</html>
